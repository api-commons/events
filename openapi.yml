openapi: 3.1.0
info:
  title: Events and Ticketing (API Commons)
  version: 0.1.0-draft.20261110
  description: 'The common Events and Ticketing interface, distilled from the harvested OpenAPI of 123 providers
    in the APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
