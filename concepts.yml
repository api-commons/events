context: events
name: Events and Ticketing
intro: >-
  The common events vocabulary -- the events people attend, the venues that host them, the
  ticket types on sale, the tickets issued and the attendees who hold them -- distilled from
  the APIs that already exist. Calendar events belong to the scheduling context.
tags: [Event, Events, Ticketing, Event Ticketing, Event Management, Live Events, Conferences, Venues]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, _embedded]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id, event_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, changed]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, event_status, sale_status, on_sale_status, published, is_published]
  name: [title, display_name, label, event_name]
  description: [summary, details, about, body, info]
  start_at: [start, start_time, starts_at, start_date, date, start_datetime, start_date_time, dates]
  end_at: [end, end_time, ends_at, end_date, end_datetime, end_date_time]
  venue_id: [venue, location_id, location, place_id, venues]
  event_id: [event, events, show_id, performance_id]
  currency: [currency_code]
  price: [amount, cost, face_value, base_price, price_amount, prices]

concepts:
  event:
    # A bare /events is a webhook feed or a calendar entry elsewhere; here it counts only at a
    # provider that also sells ticket types, issues tickets, registers attendees or lists venues.
    requires_any: [ticket_type, ticket, attendee, venue]
    segments: [events, event, shows, show, performances, sessions@events|conferences, attractions]
    aliases:
      url: [event_url, link, public_url, ticket_url]
      capacity: [max_attendees, max_capacity, limit]
      organizer_id: [organizer, organiser_id, host_id, promoter_id, owner_id]
      category: [categories, genre, classification, classifications, segment, type]
      time_zone: [timezone, tz]
  venue:
    requires_any: [event]
    segments: [venues, venue, locations@events, places@events]
    aliases:
      address: [location, street_address, address_line1, address_1]
      city: [locality]
      capacity: [max_capacity, seats]
      latitude: [lat]
      longitude: [lng, lon]
  ticket_type:
    segments: [ticket_types, ticket-types, tickettypes, ticket_classes, ticket-classes, ticketclasses, tiers@events|tickets, price_levels, products@events]
    aliases:
      quantity: [quantity_total, capacity, inventory, total_quantity, max_quantity, available]
      sales_start: [sales_start_at, on_sale_at, sale_starts_at, available_from]
      sales_end: [sales_end_at, sale_ends_at, available_until, off_sale_at]
  ticket:
    requires_any: [event]
    segments: [tickets, ticket, passes, admissions, issued_tickets]
    aliases:
      ticket_type_id: [ticket_type, ticket_class_id, tier_id, ticket_class]
      attendee_id: [attendee, holder_id, holder, owner_id, owner]
      barcode: [code, qr_code, ticket_code, scan_code]
      checked_in_at: [checked_in, scanned_at, redeemed_at, check_in_time]
  attendee:
    requires_any: [event]
    segments: [attendees, attendee, registrants, registrations, guests, participants@events]
    aliases:
      first_name: [firstname, given_name]
      last_name: [lastname, surname, family_name]
      email: [email_address, emails]
      checked_in: [is_checked_in, checked_in_at, checkin_status]
      ticket_id: [ticket, ticket_ids]

exclude:
  venue:
    elisa: not an event venue
    employ-inc: job-site locations
    findlocal: local-business listings
    hpsf: not an event venue
    impossible-metals: not an event venue
    quaker-houghton: not an event venue
    uncle-nearest: brand location listings
    breeze-chms: church-management locations
  event:
    entergram: Telegram-account events
duplicates:
  cvent: [cvent-hospitality-cloud, cvent-registration, cvent-event-cloud, cvent-platform, cvent-social-tables]
  goto-webinar: [gotowebinar]

findings:
  - "An event agrees on name, start, end, category and id across Eventbrite, Ticketmaster's
    discovery API, webinar platforms and conference tools, once webhook feeds are set aside."
  - "An attendee agrees on name and email; whether they checked in and which event they hold
    sit just below core once Cvent's six listings count once."
  - "A venue agrees only on id, name and address across the providers that expose one."
  - "Ticket types are rarely a resource of their own (5 providers); most platforms put prices
    and tiers on the event."
decisions:
  - "The Ticketing tag lives here, not in help desk: in APIs.io it mixes support tickets with
    event and transit ticketing, and this is the event side."
  - "An event counts only at a provider that also lists venues, sells ticket types, issues
    tickets or registers attendees (`requires_any`); a bare `/events` is a webhook feed or a
    calendar entry elsewhere."
  - "Shows, performances and attractions are events; registrants, registrations and guests
    are attendees; passes and admissions are tickets."
  - "Duplicates merged: six Cvent listings, GoTo Webinar."
